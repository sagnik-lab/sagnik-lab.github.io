<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Diwali Wish! ✨💥🚀</title>
<meta property="og:title" content="Diwali Wish! ✨💥🚀">
<meta property="og:description" content="Tap to light a diya and send some Diwali sparkle.">
<meta property="og:type" content="website">
<meta property="og:url" content="https://sagnik-lab.github.io/Diwali-Wish/">
<meta name="twitter:card" content="summary">
<meta name="twitter:title" content="Diwali Wish! ✨💥🚀">
<meta name="twitter:description" content="Tap to light a diya and send some Diwali sparkle.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,500;0,9..144,650;1,9..144,500&family=Outfit:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#140a24;
  --ink2:#1f1038;
  --marigold:#ff9e2c;
  --ember:#ff5a3c;
  --rose:#ff5c8a;
  --gold:#ffd166;
  --brass:#caa05a;
  --txt:#fbead2;
  --txt-dim:#d9c3ea;
  color-scheme: dark;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden;background:var(--ink);color:var(--txt);font-family:'Outfit',system-ui,sans-serif;user-select:none;-webkit-user-select:none}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{position:relative;isolation:isolate}
h1,h2,.display{font-family:'Fraunces',serif}

/* ---------- background atmosphere ---------- */
#sky{position:fixed;inset:0;z-index:0;background:
  radial-gradient(120% 90% at 50% 112%, #3a1540 0%, transparent 60%),
  radial-gradient(90% 60% at 18% -8%, #4a1f52 0%, transparent 55%),
  radial-gradient(90% 60% at 85% 6%, #2a1850 0%, transparent 55%),
  linear-gradient(180deg, var(--ink2) 0%, var(--ink) 55%, #0c0617 100%);
}
#stars{position:fixed;inset:0;z-index:0;pointer-events:none;opacity:.8}
#stars span{position:absolute;width:2px;height:2px;border-radius:50%;background:#fff6e0;animation:tw 3.2s ease-in-out infinite}
@keyframes tw{0%,100%{opacity:.15;transform:scale(1)}50%{opacity:1;transform:scale(1.6)}}

#c{position:fixed;inset:0;z-index:1;pointer-events:none}

.strip{position:fixed;top:0;bottom:0;width:min(7vw,34px);z-index:2;pointer-events:none;
  background:repeating-linear-gradient(180deg,var(--brass) 0 3px,transparent 3px 22px);
  opacity:.16;mix-blend-mode:screen}
.strip.l{left:0}.strip.r{right:0;transform:scaleX(-1)}

/* ---------- stage system ---------- */
.stage{position:fixed;inset:0;z-index:3;display:flex;flex-direction:column;align-items:center;justify-content:center;
  padding:28px 22px;text-align:center;opacity:0;pointer-events:none;transform:scale(.97);
  transition:opacity .7s cubic-bezier(.16,1,.3,1),transform .7s cubic-bezier(.16,1,.3,1)}
.stage.on{opacity:1;pointer-events:auto;transform:scale(1)}
.stage.out{opacity:0;transform:scale(1.03);transition-duration:.5s}

/* ---------- stage 1 : hero ---------- */
.rangoli-wrap{width:min(62vw,230px);margin-bottom:6px;filter:drop-shadow(0 0 26px rgba(255,158,44,.35))}
.rangoli-wrap svg{width:100%;height:100%;display:block}
.rpath{fill:none;stroke-linecap:round;stroke-linejoin:round}

.eyebrow{font-family:'Outfit';font-weight:500;letter-spacing:.04em;font-size:13px;color:var(--txt-dim);margin-bottom:2px}
.hero-title{font-size:clamp(40px,13vw,66px);font-weight:650;line-height:.98;
  background:linear-gradient(180deg,#fff2d6 0%,var(--gold) 46%,var(--marigold) 100%);
  -webkit-background-clip:text;background-clip:text;color:transparent;
  text-shadow:0 2px 40px rgba(255,158,44,.25);margin:6px 0 2px}
.hero-sub{font-style:italic;font-weight:500;font-size:clamp(17px,4.6vw,21px);color:var(--txt-dim);margin-bottom:28px}

.btn{font-family:'Outfit';font-weight:600;font-size:15px;color:#2a1304;letter-spacing:.01em;
  padding:15px 30px;border:none;border-radius:100px;cursor:pointer;
  background:linear-gradient(180deg,var(--gold),var(--marigold));
  box-shadow:0 10px 28px -8px rgba(255,158,44,.55),0 0 0 1px rgba(255,255,255,.25) inset;
  transform:translateY(0);transition:transform .25s cubic-bezier(.34,1.56,.64,1),box-shadow .25s}
.btn:active{transform:translateY(2px) scale(.97);box-shadow:0 4px 14px -6px rgba(255,158,44,.5)}
.btn.ghost{background:transparent;color:var(--txt);box-shadow:0 0 0 1.5px rgba(251,234,210,.35) inset}
.btn.ghost:active{box-shadow:0 0 0 1.5px rgba(251,234,210,.5) inset}

/* ---------- stage 2 : diya lighting ---------- */
.niche{position:relative;width:min(70vw,280px);aspect-ratio:1/1.1;display:flex;align-items:flex-end;justify-content:center;margin-bottom:34px}
.niche-glow{position:absolute;inset:-20%;border-radius:50%;background:radial-gradient(circle,rgba(255,158,44,.22),transparent 65%);
  opacity:0;transition:opacity 1.1s ease;filter:blur(6px)}
.lit .niche-glow{opacity:1}
.petal{position:absolute;font-size:22px;opacity:.55;filter:saturate(.8) brightness(.85)}
.petal.l{left:2%;bottom:14%;transform:rotate(-12deg)}
.petal.r{right:2%;bottom:14%;transform:rotate(12deg) scaleX(-1)}

.diya-svg{position:relative;width:62%;cursor:pointer;touch-action:manipulation}
.diya-svg svg{width:100%;display:block;overflow:visible}
.flame-g{opacity:0;transform-origin:170px 92px;transition:opacity .5s ease}
.lit .flame-g{opacity:1;animation:flicker 2.6s ease-in-out infinite}
@keyframes flicker{
  0%,100%{transform:translateY(0) scaleY(1) scaleX(1) rotate(0deg)}
  22%{transform:translateY(-1.5px) scaleY(1.06) scaleX(.96) rotate(-1.5deg)}
  48%{transform:translateY(.5px) scaleY(.94) scaleX(1.04) rotate(1deg)}
  70%{transform:translateY(-1px) scaleY(1.03) scaleX(.98) rotate(-.8deg)}
}
.wick{transition:opacity .4s}
.lit .wick{opacity:.25}

.hint{font-size:16px;color:var(--txt-dim);min-height:24px;transition:opacity .4s}
.hint.fade{opacity:0}

/* ---------- stage 3 : rocket + card ---------- */
.stage3-inner{position:relative;width:100%;max-width:380px;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center}

#rocket-layer{position:absolute;left:50%;bottom:16%;width:60px;height:160px;--ty:0px;transform:translate(-50%,var(--ty));pointer-events:none;z-index:1;transition:opacity .4s}
#rocket-layer svg{width:100%;height:100%;overflow:visible}
.rocket-tilt{transform-origin:50% 90%}
.trail-dot{opacity:0}

.hint2{font-size:16px;color:var(--txt-dim);margin-bottom:18px;position:relative;z-index:2}

.card{position:relative;z-index:2;width:100%;background:linear-gradient(180deg,rgba(255,255,255,.08),rgba(255,255,255,.03));
  backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);
  border:1px solid rgba(255,214,102,.22);border-radius:26px;padding:30px 24px 26px;
  box-shadow:0 20px 60px -20px rgba(0,0,0,.6),0 0 0 1px rgba(255,255,255,.04) inset;
  opacity:0;pointer-events:none;position:absolute;transform:translateY(14px) scale(.98);
  transition:opacity .55s cubic-bezier(.16,1,.3,1),transform .55s cubic-bezier(.16,1,.3,1)}
.card.on{opacity:1;pointer-events:auto;position:relative;transform:translateY(0) scale(1)}
.card h2{font-size:26px;font-weight:650;color:var(--gold);margin-bottom:8px}
.card p{font-size:14.5px;color:var(--txt-dim);margin-bottom:18px;line-height:1.5}

.field{position:relative;margin-bottom:12px}
.field input{width:100%;font-family:'Outfit';font-size:15px;color:var(--txt);
  background:rgba(255,255,255,.05);border:1.3px solid rgba(255,255,255,.14);border-radius:13px;
  padding:14px 15px;outline:none;transition:border-color .25s,background .25s}
.field input::placeholder{color:rgba(217,195,234,.5)}
.field input:focus{border-color:var(--gold);background:rgba(255,255,255,.08)}

.row{display:flex;gap:10px;margin-top:4px}
.row .btn{flex:1}

/* reveal card */
.rg{width:120px;height:120px;margin:-4px auto 6px;overflow:visible}
.rg path,.rg circle{fill:none;stroke:var(--gold);stroke-width:1.4;opacity:.75}
.rg circle:last-child{stroke:var(--brass);opacity:.4}

.env{position:relative;width:100%;max-width:230px;margin:6px auto 16px;aspect-ratio:16/10;cursor:pointer;perspective:400px;
  background:linear-gradient(160deg,#2a1540,#1a0c2c);border-radius:14px;
  box-shadow:0 14px 32px -12px rgba(0,0,0,.55),0 0 0 1px rgba(255,214,102,.18) inset;
  display:flex;align-items:center;justify-content:center;flex-direction:column;gap:8px;
  transition:transform .3s cubic-bezier(.34,1.56,.64,1)}
.env:active{transform:scale(.96)}
.env .flap{position:absolute;top:0;left:0;right:0;height:52%;background:linear-gradient(160deg,#3a1d54,#241334);
  clip-path:polygon(0 0,100% 0,50% 100%);border-radius:14px 14px 0 0;transform-origin:top;transition:transform .5s cubic-bezier(.4,0,.2,1)}
.env.open .flap{transform:rotateX(180deg) translateY(1px)}
.seal{width:30px;height:30px;display:flex;align-items:center;justify-content:center;font-size:16px;z-index:1;
  filter:drop-shadow(0 2px 6px rgba(0,0,0,.4))}
.env span{font-size:12.5px;color:var(--txt-dim);z-index:1}
.env.open span{display:none}

.scr{max-height:0;overflow:hidden;transition:max-height .6s cubic-bezier(.16,1,.3,1),margin .6s}
.scr.on{max-height:220px;margin-bottom:10px}
.scr p{font-size:14.5px;line-height:1.6}
#by{font-style:italic;color:var(--brass);margin-top:8px;font-size:13.5px}

#shr{width:100%;margin-top:4px}

/* ---------- misc ---------- */
.skip{position:fixed;top:calc(env(safe-area-inset-top,0px) + 16px);right:16px;z-index:5;
  font-size:12.5px;color:var(--txt-dim);opacity:.45;background:none;border:none;padding:6px 10px;cursor:pointer}

@media (prefers-reduced-motion:reduce){
  .lit .flame-g{animation:none}
  #stars span{animation:none;opacity:.5}
}
</style>
</head>
<body>

<div id="sky"></div>
<div id="stars"></div>
<canvas id="c"></canvas>
<div class="strip l"></div><div class="strip r"></div>

<!-- STAGE 1 — hero -->
<section class="stage on" id="s1">
  <div class="rangoli-wrap">
    <svg viewBox="0 0 200 200">
      <g class="rpath" id="rangoli" stroke="#ffd166" stroke-width="1.6">
        <circle cx="100" cy="100" r="86" stroke-opacity=".5"/>
        <g id="petals"></g>
        <circle cx="100" cy="100" r="30" stroke="#ff9e2c" stroke-opacity=".7"/>
        <circle cx="100" cy="100" r="8" fill="#ffd166" stroke="none"/>
      </g>
    </svg>
  </div>
  <p class="eyebrow">A little light, just for you</p>
  <h1 class="hero-title">Happy<br>Diwali</h1>
  <p class="hero-sub">the festival of lights has arrived</p>
  <button class="btn" data-next="s2">Begin the wish</button>
</section>

<!-- STAGE 2 — diya -->
<section class="stage" id="s2">
  <div class="niche" id="niche">
    <div class="niche-glow"></div>
    <span class="petal l">🌺</span><span class="petal r">🌺</span>
    <div class="diya-svg" id="diya">
      <svg viewBox="0 0 340 140">
        <defs>
          <radialGradient id="flameGrad" cx="50%" cy="30%" r="75%">
            <stop offset="0%" stop-color="#fff6c9"/>
            <stop offset="35%" stop-color="#ffd166"/>
            <stop offset="70%" stop-color="#ff9e2c"/>
            <stop offset="100%" stop-color="#ff5a3c" stop-opacity="0"/>
          </radialGradient>
          <linearGradient id="clayGrad" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="#b56a3a"/>
            <stop offset="100%" stop-color="#7c3f20"/>
          </linearGradient>
          <radialGradient id="glowSoft" cx="50%" cy="50%" r="50%">
            <stop offset="0%" stop-color="#ffb347" stop-opacity=".9"/>
            <stop offset="100%" stop-color="#ffb347" stop-opacity="0"/>
          </radialGradient>
        </defs>
        <g class="flame-g">
          <ellipse cx="170" cy="78" rx="46" ry="46" fill="url(#glowSoft)"/>
          <path d="M170 92 C150 92 140 68 155 44 C160 36 165 28 170 16 C175 28 180 36 185 44 C200 68 190 92 170 92 Z" fill="url(#flameGrad)"/>
          <path d="M170 92 C160 92 155 78 163 62 C166 56 168 50 170 42 C172 50 174 56 177 62 C185 78 180 92 170 92 Z" fill="#fff6c9" opacity=".85"/>
        </g>
        <path class="wick" d="M168 94 L172 94 L171 100 L169 100 Z" fill="#3a2010"/>
        <path d="M60 100 Q60 80 100 78 Q170 72 240 78 Q280 80 280 100 Q280 118 240 122 L100 122 Q60 118 60 100Z" fill="url(#clayGrad)"/>
        <ellipse cx="170" cy="100" rx="105" ry="13" fill="#4a2410" opacity=".55"/>
        <ellipse cx="170" cy="96" rx="92" ry="8" fill="#c9793f"/>
        <path d="M70 100 Q170 118 270 100" stroke="#5a2e15" stroke-width="2" fill="none" opacity=".4"/>
      </svg>
    </div>
  </div>
  <p class="hint" id="h2">Tap the diya to light it</p>
</section>

<!-- STAGE 3 — rocket + wish card -->
<section class="stage" id="s3">
  <div class="stage3-inner">
    <div id="rocket-layer">
      <svg viewBox="0 0 60 160">
        <defs>
          <linearGradient id="rBody" x1="0" y1="0" x2="1" y2="0">
            <stop offset="0%" stop-color="#ffd166"/>
            <stop offset="100%" stop-color="#ff9e2c"/>
          </linearGradient>
        </defs>
        <g id="rocketShape" class="rocket-tilt">
          <path d="M30 2 L42 44 L18 44 Z" fill="#ff5c8a"/>
          <rect x="18" y="44" width="24" height="68" rx="6" fill="url(#rBody)"/>
          <path d="M18 60 L4 86 L18 80Z" fill="#ff5a3c"/>
          <path d="M42 60 L56 86 L42 80Z" fill="#ff5a3c"/>
          <circle cx="30" cy="64" r="7" fill="#fff6e0" opacity=".9"/>
          <path d="M18 112 L12 150 L30 134 L48 150 L42 112Z" fill="#ff9e2c"/>
        </g>
      </svg>
    </div>
    <div class="hint2" id="h3">Double-tap to launch it</div>

    <div class="card" id="c1">
      <h2>Happy Diwali</h2>
      <p>Who should we send this light to?</p>
      <div class="field"><input id="nm" maxlength="24" placeholder="Their name" autocomplete="off"></div>
      <div class="field"><input id="fr" maxlength="24" placeholder="Your name (optional)" autocomplete="off"></div>
      <div class="row"><button class="btn" id="mk">Make card &amp; link</button></div>
    </div>

    <div class="card" id="c2">
      <svg class="rg" viewBox="-50 -50 100 100">
        <path pathLength="1" d="M0 0C-12-18-8-36 0-46C8-36 12-18 0 0"/>
        <path pathLength="1" d="M0 0C-12-18-8-36 0-46C8-36 12-18 0 0" transform="rotate(45)"/>
        <path pathLength="1" d="M0 0C-12-18-8-36 0-46C8-36 12-18 0 0" transform="rotate(90)"/>
        <path pathLength="1" d="M0 0C-12-18-8-36 0-46C8-36 12-18 0 0" transform="rotate(135)"/>
        <path pathLength="1" d="M0 0C-12-18-8-36 0-46C8-36 12-18 0 0" transform="rotate(180)"/>
        <path pathLength="1" d="M0 0C-12-18-8-36 0-46C8-36 12-18 0 0" transform="rotate(225)"/>
        <path pathLength="1" d="M0 0C-12-18-8-36 0-46C8-36 12-18 0 0" transform="rotate(270)"/>
        <path pathLength="1" d="M0 0C-12-18-8-36 0-46C8-36 12-18 0 0" transform="rotate(315)"/>
        <circle pathLength="1" r="11"/>
        <circle pathLength="1" r="48" style="stroke-dasharray:.01 .012"/>
      </svg>
      <h2 id="to">Happy Diwali</h2>
      <div class="env" id="env"><i class="flap"></i><div class="seal">🪔</div><span>Tap to open your letter</span></div>
      <div class="scr" id="scr"><p id="msg"></p><p id="by"></p></div>
      <div class="field"><input id="wish" maxlength="40" placeholder="Whisper a wish for the sky"></div>
      <button class="btn" id="shr">Share this wish</button>
    </div>
  </div>
</section>

<script>
const $=id=>document.getElementById(id);
const Q=s=>document.querySelector(s);

/* ---------- stars ---------- */
(function stars(){
  const host=$('stars'),n=48;
  for(let i=0;i<n;i++){
    const s=document.createElement('span');
    s.style.left=Math.random()*100+'%';
    s.style.top=Math.random()*62+'%';
    s.style.animationDelay=(Math.random()*3.2)+'s';
    s.style.width=s.style.height=(Math.random()*1.6+1)+'px';
    host.appendChild(s);
  }
})();

/* ---------- rangoli petals (drawn once, animated stroke-dashoffset on load) ---------- */
(function rangoli(){
  const g=$('petals'),petals=12,r1=42,r2=78;
  let d='';
  for(let i=0;i<petals;i++){
    const a=(i/petals)*Math.PI*2, a2=((i+.5)/petals)*Math.PI*2;
    const x1=100+Math.cos(a)*r1, y1=100+Math.sin(a)*r1;
    const x2=100+Math.cos(a)*r2, y2=100+Math.sin(a)*r2;
    const cx=100+Math.cos(a2)*(r1+14), cy=100+Math.sin(a2)*(r1+14);
    d+=`M${x1.toFixed(1)} ${y1.toFixed(1)} Q${cx.toFixed(1)} ${cy.toFixed(1)} ${x2.toFixed(1)} ${y2.toFixed(1)} `;
  }
  const p=document.createElementNS('http://www.w3.org/2000/svg','path');
  p.setAttribute('d',d);
  p.setAttribute('class','rpath');
  p.setAttribute('stroke-opacity','.8');
  g.appendChild(p);
  const len=p.getTotalLength();
  p.style.strokeDasharray=len;
  p.style.strokeDashoffset=len;
  p.animate([{strokeDashoffset:len},{strokeDashoffset:0}],{duration:1600,easing:'cubic-bezier(.4,0,.2,1)',fill:'forwards',delay:200});
})();

/* ---------- particle canvas: ambient embers + bursts ---------- */
const cv=$('c'),ctx=cv.getContext('2d');
let W,H,DPR=Math.min(devicePixelRatio||1,2);
function resize(){W=cv.width=innerWidth*DPR;H=cv.height=innerHeight*DPR;cv.style.width=innerWidth+'px';cv.style.height=innerHeight+'px'}
resize();addEventListener('resize',resize);

let embers=[],bursts=[];
function spawnEmbers(){
  if(embers.length>36)return;
  embers.push({x:Math.random()*W,y:H+10,vx:(Math.random()-.5)*.15*DPR,vy:-(.25+Math.random()*.35)*DPR,
    r:(1+Math.random()*2)*DPR,life:0,max:500+Math.random()*400,hue:28+Math.random()*30});
}
function burst(x,y,count,power,hueBase){
  for(let i=0;i<count;i++){
    const a=Math.random()*Math.PI*2,sp=(power*.4+Math.random()*power)*DPR;
    bursts.push({x,y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,r:(1.4+Math.random()*2.2)*DPR,
      life:0,max:650+Math.random()*450,hue:hueBase+Math.random()*40-20,grav:.012*DPR});
  }
}
function loop(){
  ctx.clearRect(0,0,W,H);
  if(Math.random()<.4)spawnEmbers();
  ctx.globalCompositeOperation='lighter';
  embers=embers.filter(e=>e.life<e.max);
  embers.forEach(e=>{
    e.life++;e.x+=e.vx;e.y+=e.vy;e.vx+=Math.sin(e.life*.02)*.004*DPR;
    const t=e.life/e.max,op=Math.sin(t*Math.PI)*.55;
    ctx.beginPath();ctx.fillStyle=`hsla(${e.hue},95%,62%,${op})`;
    ctx.arc(e.x,e.y,e.r,0,7);ctx.fill();
  });
  bursts=bursts.filter(b=>b.life<b.max);
  bursts.forEach(b=>{
    b.life++;b.x+=b.vx;b.y+=b.vy;b.vy+=b.grav;b.vx*=.985;b.vy*=.985;
    const t=b.life/b.max,op=(1-t)*.9;
    ctx.beginPath();ctx.fillStyle=`hsla(${b.hue},100%,68%,${op})`;
    ctx.arc(b.x,b.y,b.r*(1-t*.4),0,7);ctx.fill();
  });
  ctx.globalCompositeOperation='source-over';
  requestAnimationFrame(loop);
}
loop();

/* ---------- shared wish-recipient state ---------- */
let LINK='',RC=null;

/* ---------- stage nav ---------- */
function goto(id){
  document.querySelectorAll('.stage.on').forEach(s=>{s.classList.add('out');s.classList.remove('on');
    setTimeout(()=>s.classList.remove('out'),520)});
  setTimeout(()=>$(id).classList.add('on'),60);
}
document.querySelectorAll('[data-next]').forEach(b=>b.onclick=()=>goto(b.dataset.next));

/* ---------- stage 2 : light the diya ---------- */
let lit=false;
$('diya').onclick=()=>{
  if(lit)return;lit=true;
  $('niche').classList.add('lit');
  $('h2').textContent='✨ Light carries a wish';
  const r=$('diya').getBoundingClientRect();
  burst((r.left+r.width*.5)*DPR,(r.top+r.height*.32)*DPR,26,2.2,36);
  setTimeout(()=>{
    $('h2').classList.add('fade');
    setTimeout(()=>goto('s3'),650);
  },1100);
};

/* ---------- stage 3 : rocket double-tap launch ---------- */
let launched=false,tapT=0;
const rocketLayer=$('rocket-layer'),rocketShape=$('rocketShape');
function tiltLoop(){
  if(!launched){
    const t=Date.now()/1000;
    rocketShape.style.transform=`rotate(${Math.sin(t*1.3)*2.2}deg)`;
  }
  requestAnimationFrame(tiltLoop);
}
tiltLoop();

rocketLayer.addEventListener('click',()=>{
  const now=Date.now();
  if(now-tapT<380)launchRocket();
  tapT=now;
});
function launchRocket(){
  if(launched)return;launched=true;
  $('h3').style.opacity=0;
  const el=rocketLayer;
  let y=0,vy=0,t0=performance.now();
  const startRect=el.getBoundingClientRect();
  function step(now){
    const dt=Math.min((now-t0)/1000,.032);t0=now;
    vy+=38*dt;y-=vy*dt*26;
    el.style.setProperty('--ty',y+'px');
    if(Math.random()<.9){
      const rect=el.getBoundingClientRect();
      burst((rect.left+rect.width/2)*DPR,(rect.bottom-14)*DPR,2,.6,30);
    }
    if(-y < innerHeight*.78){requestAnimationFrame(step)}
    else{
      const rect=el.getBoundingClientRect();
      burst((rect.left+rect.width/2)*DPR,(rect.top+14)*DPR,70,3.4,Math.random()*60);
      setTimeout(()=>burst((rect.left+rect.width/2)*DPR,(rect.top+14)*DPR,40,2.2,300+Math.random()*40),140);
      el.style.opacity='0';
      setTimeout(showCard,500);
    }
  }
  requestAnimationFrame(step);
}
function showCard(){
  const card = RC ? $('c2') : $('c1');
  if(RC){$('to').textContent=(RC.n?RC.n+', ':'')+'Happy Diwali';}
  card.classList.add('on');
}

/* ---------- card 1 : make link ---------- */
const sl=s=>s.replace(/[^A-Za-z0-9]+/g,'-').replace(/^-|-$/g,'');
$('mk').onclick=()=>{
  const n=$('nm').value.trim(),f=$('fr').value.trim();
  const h=sl(n)+(f&&sl(f)?'-from-'+sl(f):'');
  LINK=location.href.split('#')[0]+(sl(n)?'#'+h:'');
  card(n,f);
};
function card(n,f){
  $('c1').classList.remove('on');
  $('to').textContent=n?n+', Happy Diwali':'Happy Diwali';
  $('msg').textContent=(n?n+', ':'')+'may this Diwali light up every corner of your life with joy, warmth, and good fortune.';
  $('by').textContent=f?'— '+f:'';
  $('c2').classList.add('on');
}

/* ---------- read hash on load ---------- */
(function(){
  const h=decodeURIComponent(location.hash.slice(1));
  if(!h)return;
  const p=h.split('-from-'),n=p[0].replace(/-/g,' ').trim(),f=(p[1]||'').replace(/-/g,' ').trim();
  if(!n)return;
  RC={n,f};LINK=location.href;
  Q('.hero-sub').textContent=n+', this light is for you';
})();

/* ---------- envelope open ---------- */
$('env').onclick=()=>{
  $('env').classList.add('open');
  setTimeout(()=>{$('scr').classList.add('on')},280);
};

/* ---------- share ---------- */
$('shr').onclick=async()=>{
  const n=$('nm').value.trim();
  const text=(n?n+', ':'')+'wishing you a sparkling Diwali! Light a diya and a rocket for you:';
  const url=LINK||location.href.split('#')[0];
  try{
    if(navigator.share)await navigator.share({title:'Diwali Wish! ✨💥🚀',text,url});
    else{await navigator.clipboard.writeText(text+' '+url);$('shr').textContent='Link copied ✓'}
  }catch(e){}
};
</script>
