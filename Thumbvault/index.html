<script>
const SEARCH_BAR = document.getElementById("search");
const GO_BTN = document.getElementById("go-btn");

const COUNTS = { youtube: YT_COUNT, wayback: WB_COUNT };

];
const STATIC_DOMAINS = [
  "static.youtube.com",
  "static08.youtube.com"
];
const THUMB_TYPES = [
  "vi",

];
const AVAIL_TEMPLATE = "https://archive.org/wayback/available?url=";

let openConns = 0;
let lastSearch = null;
let apiBlocked = false;

// Monotonically increasing search generation. Any in-flight request from a
// previous search checks its captured generation against the current one
// before touching the DOM, so stale results from an old search can never
// render after the user starts a new one.
let searchGen = 0;

function setStatus(msg, active) {
  OUTPUT.innerHTML = msg;
  STATUS_ROW.classList.toggle("active", !!active);
}

function clearResults() {
  YT_GRID.innerHTML = "";
  WB_GRID.innerHTML = "";
  PRELOADER.innerHTML = "";
  YT_COUNT.textContent = "";
  WB_COUNT.textContent = "";
  YT_SECTION.className = "section invis";
  WB_SECTION.className = "section invis";
  RESULTS.className = "invis";
}

function bumpCount(group) {
  const el = COUNTS[group];
  const current = parseInt(el.dataset.n || "0", 10) + 1;
  el.dataset.n = current;
  el.textContent = current + (current === 1 ? " found" : " found");
}

function verifyConn(func, args) {
  if (openConns >= MAX_CONNS) {
    setTimeout(func, 100, ...args);
  } else {
    openConns += 1;
    return true;
  }
}

function createThumbnail(url, group, cdxURL, gen) {
  if (cdxURL) {
    if (!verifyConn(createThumbnail, arguments)) {
      return;
    }
  }

  // Stale search guard: a previous search's in-flight request landed late.
  if (gen !== searchGen) {
    if (cdxURL) openConns -= 1;
    return;
  }

  const grid = GRIDS[group];
  const section = SECTIONS[group];
  const container = document.createElement("div");
  container.className = "thumb-card";
  const img = document.createElement("img");
  img.loading = "lazy";

  img.onload = function () {
    openConns -= 1;
    if (gen !== searchGen) return;
    RESULTS.className = "";
    section.className = "section";
    grid.append(container);
    bumpCount(group);
  };

  img.onerror = function () {
    openConns -= 1;
    img.remove();
  };

  img.src = url;
  container.append(img);

  if (cdxURL) {
    const label = document.createElement("a");
    label.href = "https://web.archive.org/web/*/" + cdxURL.split("://")[2];
    label.target = "_blank";
    label.rel = "noopener";
    label.title = "See more from this domain";
    label.innerHTML = "↗";
    label.className = "cdx-link";
    container.append(label);
  }

  PRELOADER.append(container);
}

function parseCDX(url, content, gen) {
  if (gen !== searchGen) return;

  const cdx = JSON.parse(content);

  if ("closest" in cdx["archived_snapshots"]) {
    const thumb_data = cdx["archived_snapshots"]["closest"];

    if (thumb_data["status"] == "200") {
      createThumbnail(
        thumb_data["url"].replace(/^https*:\/\/web.archive.org\/web\/(\d{14})/, "https://web.archive.org/web/$1id_"),
        "wayback",
        url,
        gen
      );
    }
  }
}

async function requestURL(url, group, method, gen) {
  if (!verifyConn(requestURL, arguments)) {
    return;
  }

  if (method) {
    try {
      const response = await fetch(url, { method: method });
      openConns -= 1;

      if (gen !== searchGen) return;

      if (!response.ok) {
        throw new Error(`${response.status}`);
      }

      switch (group) {
        case "wayback":
          parseCDX(url, await response.text(), gen);
          break;
        case "youtube":
          createThumbnail(url, group, null, gen);
        default:
          return await response.text();
      }
    } catch (error) {
      openConns -= 1;
      if (gen !== searchGen) return;

      if (error.toString().includes("Failed to fetch")) {
        setStatus("Too many requests. Close any Wayback Machine tabs and try again later.", false);
      } else if (error != "Error: 404") {
        console.error("Request error:", error);
      }
    }
  } else {
    createThumbnail(url, group, null, gen);
  }
}

let totalDelay = 0;

function delayedFetch(url, group, delay, method, gen) {
  setTimeout(() => {
    if (gen !== searchGen) return;
    requestURL(url, group, method, gen);
  }, totalDelay);

  totalDelay += delay;
}

function prefireMessage(msg, gen) {
  setTimeout(() => {
    if (gen !== searchGen) return;
    setStatus(msg, true);
  }, totalDelay);
}

function checkIfFinished(gen) {
  if (gen !== searchGen) return;

  if (openConns > 0) {
    setTimeout(() => checkIfFinished(gen), 100);
    return;
  }

  const foundAny = YT_GRID.children.length > 0 || WB_GRID.children.length > 0;

  if (!foundAny) {
    setStatus("No surviving thumbnails found for this video.", false);
  } else if (apiBlocked) {
    setStatus("Done — API limited for some post-2007 thumbnails, try again later for a fuller scan.", false);
  } else {
    setStatus("Scan complete.", false);
  }
}

function grabFrames(domain_list, video, dir, ext, addDefault, gen) {
  for (const domain of domain_list) {
    prefireMessage(`Checking ${domain} on the Wayback Machine…`, gen);

    if (addDefault) {
      for (const q of ["", ...QUALITIES]) {
        delayedFetch(`https://web.archive.org/web/0id_/http://${domain}/${dir}/${video}/${q}default.${ext}`, "wayback", 100, null, gen);

        for (let i = 0; i <= 3; i++) {
          delayedFetch(`https://web.archive.org/web/0id_/http://${domain}/${dir}/${video}/${q}${i}.${ext}`, "wayback", 100, null, gen);
        }
      }
    } else {
      for (let i = 0; i <= 3; i++) {
        delayedFetch(`https://web.archive.org/web/0id_/http://${domain}/${dir}/${video}/${i}.${ext}`, "wayback", 100, null, gen);
      }
    }
  }
}

function triggerSearch(searchValue, prefix, gen) {
  totalDelay = 0;

  let video = "/" + searchValue + "/";
  const matchData = video.match(/\W([A-Za-z0-9_-]{10}[AEIMQUYcgkosw048])\W/);

  if (matchData) {
    video = matchData[1];

    setStatus("Checking YouTube…", true);

    requestURL(`https://i.ytimg.com/vi/${video}/frame0.jpg`, "youtube", "HEAD", gen);

    for (const q of QUALITIES) {
      for (let i = 1; i <= 3; i++) {
        requestURL(`https://i.ytimg.com/vi/${video}/${q}${i}.jpg`, "youtube", "HEAD", gen);
      }
    }

    if (apiBlocked) {
      grabFrames(DOMAINS, video, "vi", "jpg", true, gen);
      grabFrames(DOMAINS, video, "vi_webp", "webp", true, gen);
    } else {
      for (const domain of DOMAINS) {
        prefireMessage(`Checking ${domain} on the Wayback Machine…`, gen);
        for (const format of THUMB_TYPES) {
          delayedFetch(AVAIL_TEMPLATE + prefix + `${domain}/${format}/${video}/*`, "wayback", 750, "GET", gen);
        }
      }

      prefireMessage("Checking i9.ytimg.com on the Wayback Machine…", gen);
      delayedFetch(AVAIL_TEMPLATE + prefix + `i9.ytimg.com/vi_blogger/${video}/*`, "wayback", 750, "GET", gen);
    }

    grabFrames(OLD_DOMAINS, video, "vi", "jpg", false, gen);

    for (const domain of STATIC_DOMAINS) {
      prefireMessage(`Checking ${domain} on the Wayback Machine…`, gen);
      delayedFetch(`https://web.archive.org/web/0id_/http://${domain}/get_still.php?video_id=${video}`, "wayback", 100, null, gen);
      for (let i = 1; i <= 3; i++) {
        delayedFetch(`https://web.archive.org/web/0id_/http://${domain}/get_still.php?video_id=${video}&still_id=${i}`, "wayback", 100, null, gen);
      }
    }

    setTimeout(() => checkIfFinished(gen), totalDelay);
  } else {
    setStatus("That doesn't look like a valid YouTube URL or video ID.", false);
  }
}

// Ensure a verified archive is present - otherwise, user is rate-limited (no results).
// Strangely, changing URLs fixes this. Since a URL's protocol is stripped on the backend,
// changing it fixes the problem. Any protocol is allowed, as long as it begins with a letter.
async function confirmSearch(searchValue) {
  const trimmed = (searchValue || "").trim();
  if (!trimmed) return;

  // New search: bump generation and hard-clear all prior results immediately.
  searchGen += 1;
  const gen = searchGen;
  openConns = 0;
  totalDelay = 0;
  apiBlocked = false;
  clearResults();

  const protocol = `a${Math.floor(Math.random() * 100).toString().padStart(2, "0")}://`;
  setStatus("Verifying archive access…", true);

  const verifyAPI = await requestURL(`https://archive.org/wayback/available?url=${protocol}i1.ytimg.com/vi/TPAWpHG3RWY/*`, "none", "GET", gen);

  if (gen !== searchGen) return;

  if (verifyAPI) {
    apiBlocked = !verifyAPI.includes("closest");
  }

  triggerSearch(trimmed, protocol, gen);
}

SEARCH_BAR.addEventListener("keydown", function (event) {
  if (event.key === "Enter") {
    confirmSearch(SEARCH_BAR.value);
  }
});

GO_BTN.addEventListener("click", function () {
  confirmSearch(SEARCH_BAR.value);
});

</script>
